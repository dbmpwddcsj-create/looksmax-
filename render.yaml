services:
  - type: web
    name: rating-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py

    envVars:
      - key: BOT_TOKEN
        sync: false

      - key: ADMIN_ID
        sync: false

      - key: DATABASE_URL
        sync: false

      - key: RENDER_EXTERNAL_URL
        sync: false

      - key: WEBHOOK_SECRET
        sync: false

      - key: PORT
        value: "10000"
